[package]
name = "rye-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core abstractions for rye — Component trait, Renderer trait, Element, template engine"

[features]
default = ["webview"]
# WebView renderer (WASM + DOM) — default, works everywhere
webview = []
# Native GPU renderer (wgpu + taffy) — opt-in for desktop/mobile native
native = []
wee_alloc = ["dep:wee_alloc"]

[dependencies]
rye-signals = { workspace = true }
rye-serialize = { workspace = true }
wee_alloc = { version = "0.4", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Location", "UrlSearchParams", "BroadcastChannel", "History",
] }

[dev-dependencies]
tokio = { workspace = true }
