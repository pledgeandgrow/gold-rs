[package]
name = "rye-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop renderer for rye — wgpu + winit + taffy, no WebView"

[dependencies]
rye-core = { workspace = true }
rye-signals = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
taffy = { workspace = true }
cosmic-text = { workspace = true, features = ["swash"] }
lyon = { workspace = true }
raw-window-handle = "0.6"
pollster = "1"
bytemuck = "1"
