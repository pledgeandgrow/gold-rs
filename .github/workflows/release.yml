name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Pre-release Checks ─────────────────────────────────────
  pre-checks:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --workspace

  # ── Publish to crates.io ───────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: pre-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish rye-serialize
        run: cargo publish -p rye-serialize --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-signals
        run: cargo publish -p rye-signals --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-core
        run: cargo publish -p rye-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-macros
        run: cargo publish -p rye-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-html
        run: cargo publish -p rye-html --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-router
        run: cargo publish -p rye-router --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-forms
        run: cargo publish -p rye-forms --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-i18n
        run: cargo publish -p rye-i18n --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-animations
        run: cargo publish -p rye-animations --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-ssr
        run: cargo publish -p rye-ssr --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-desktop
        run: cargo publish -p rye-desktop --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-mobile
        run: cargo publish -p rye-mobile --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-testing
        run: cargo publish -p rye-testing --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish rye-devtools
        run: cargo publish -p rye-devtools --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── GitHub Release ─────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
